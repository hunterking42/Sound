# Builds a debug APK in the cloud (GitHub Actions) so you do not need Android Studio.
# Use: create a GitHub repository whose ROOT is the contents of this Android folder, push it,
# open the Actions tab > "Build APK" > Run workflow, then download the artifact "SoundBomb-debug-apk".
# The debug APK is signed with a debug key: fine for testing. Make the signed release build later.
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install the Android platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SoundBomb-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
